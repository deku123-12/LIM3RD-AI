<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LIM3RD AI</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #090711;
    color: white;
    font-family: Arial, sans-serif;
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
}

/* HEADER */

header {
    padding: 18px;
    background: #110c20;
    border-bottom: 1px solid #38205c;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    color: #c084fc;
    font-size: 21px;
    font-weight: bold;
    letter-spacing: 2px;
}

.status {
    font-size: 10px;
    color: #a78bfa;
    margin-top: 5px;
    letter-spacing: 1px;
}

.mode {
    background: #24143b;
    color: #d8b4fe;
    border: 1px solid #7844a8;
    padding: 9px;
    border-radius: 8px;
}

/* CHAT AREA */

main {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    scroll-behavior: smooth;
}

.welcome {
    text-align: center;
    margin-top: 25%;
}

.orb {
    width: 90px;
    height: 90px;
    border-radius: 50%;
    margin: auto;
    background: linear-gradient(135deg, #9333ea, #312e81);
    box-shadow: 0 0 35px #9333ea;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 38px;
}

.welcome h2 {
    margin-top: 20px;
    color: #d8b4fe;
}

.welcome p {
    color: #9ca3af;
    margin-top: 10px;
    font-size: 13px;
}

/* MESSAGES */

.message {
    padding: 13px;
    margin: 12px 0;
    border-radius: 14px;
    max-width: 85%;
    line-height: 1.5;
    font-size: 14px;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}

.user {
    background: #52228b;
    margin-left: auto;
}

.ai {
    background: #1c1530;
    border: 1px solid #493064;
}

/* INPUT AREA */

footer {
    padding: 12px;
    background: #110c20;
    border-top: 1px solid #38205c;
}

.input-area {
    display: flex;
    gap: 8px;
}

input {
    flex: 1;
    min-width: 0;
    background: #1b1429;
    border: 1px solid #57377c;
    color: white;
    border-radius: 12px;
    padding: 14px;
    outline: none;
    font-size: 14px;
}

input:focus {
    border-color: #a855f7;
}

button {
    background: #9333ea;
    border: none;
    color: white;
    padding: 12px 18px;
    border-radius: 12px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
}

button:active {
    background: #6b21a8;
}

.bottom {
    text-align: center;
    color: #716582;
    font-size: 10px;
    margin-top: 10px;
    letter-spacing: 1px;
}
</style>
</head>

<body>

<!-- HEADER -->

<header>

    <div>
        <div class="logo">✦ LIM3RD AI</div>
        <div class="status">PERSONAL AI ASSISTANT</div>
    </div>

    <select class="mode" id="mode">
        <option value="online">ONLINE</option>
        <option value="offline">OFFLINE</option>
    </select>

</header>

<!-- MAIN CHAT -->

<main id="chat">

    <div class="welcome" id="welcome">

        <div class="orb">✦</div>

        <h2>Welcome to LIM3RD AI</h2>

        <p>Your personal intelligence begins here.</p>

        <p>What can I help you with today?</p>

    </div>

</main>

<!-- MESSAGE INPUT -->

<footer>

    <div class="input-area">

        <input
            id="message"
            type="text"
            placeholder="Message LIM3RD AI..."
            autocomplete="off"
        >

        <button id="sendBtn" type="button">➤</button>

    </div>

    <div class="bottom">
        LIM3RD AI • VERSION 0.1
    </div>

</footer>

<!-- JAVASCRIPT -->

<script>

function sendMessage() {

    const input = document.getElementById("message");
    const chat = document.getElementById("chat");
    const welcome = document.getElementById("welcome");

    const text = input.value.trim();

    if (!text) return;

    // Remove welcome screen

    if (welcome) {
        welcome.remove();
    }

    // Display user message

    const userMessage = document.createElement("div");

    userMessage.className = "message user";

    userMessage.textContent = text;

    chat.appendChild(userMessage);

    // Clear input

    input.value = "";

    // Create AI response

    const aiMessage = document.createElement("div");

    aiMessage.className = "message ai";

    const mode = document.getElementById("mode").value;

    aiMessage.textContent =
        "Hello! I'm LIM3RD AI. ✦ Developed by:Ricky Moguel\n\n" +
        "Your message has been received.\n\n" +
        "Current Mode: " + mode.toUpperCase() +
        "\n\nAI engine connection is coming soon.";

    chat.appendChild(aiMessage);

    // Scroll to latest message

    chat.scrollTop = chat.scrollHeight;

    input.focus();
}

// ENTER KEY FIX

document.getElementById("message")
.addEventListener("keydown", function(event) {

    if (event.key === "Enter") {

        event.preventDefault();

        sendMessage();

    }

});

// SEND BUTTON

document.getElementById("sendBtn")
.addEventListener("click", sendMessage);

</script>

</body>
</html>
